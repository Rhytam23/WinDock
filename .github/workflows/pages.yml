# Publishes the website in site/ to GitHub Pages (https://rhytam23.github.io/WinDock/) whenever it changes.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Browsers keep style.css and the scripts for a while; a new version tag on every publish makes them
      # fetch the files that match the new page (otherwise a cached old style.css can break the layout).
      - run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # GitHub sometimes lists a just-uploaded artifact a few seconds late; without this pause the deploy
      # step can fail with "No artifacts named github-pages were found".
      - run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v5
